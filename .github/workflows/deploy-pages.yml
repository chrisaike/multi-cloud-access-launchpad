name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (GitHub Pages base path)
        env:
          GITHUB_PAGES: "true"
          # Must match the repo name so assets resolve under /<repo>/.
          PAGES_BASE: "/multi-cloud-access-launchpad/"
          # Demo mode so the published preview needs no Okta config.
          VITE_AUTH_MODE: "mock"
        run: npm run build

      - name: SPA fallback (copy index.html -> 404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically using the workflow's own token
          # (has pages: write), so no manual repo-settings step is needed.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
